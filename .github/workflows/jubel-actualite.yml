name: jubel-actualite
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 10 * * *"
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      revue:
        description: "Générer aussi la Revue du Jour"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: jubel-content
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérifier les types des scripts
        run: npm run typecheck:scripts

      - name: Générer la Revue du Jour
        id: revue
        if: github.event.schedule == '0 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.revue)
        continue-on-error: true
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: npx tsx scripts/revue/run.ts

      - name: Générer les analyses d'actualité
        id: actualite
        continue-on-error: true
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/actualite/run.ts

      - name: Publier
        if: always()
        run: |
          git config user.name "jubel-bot"
          git config user.email "bot@jubel.sn"
          git add content/revue-du-jour content/actualite public/illustrations
          if git diff --staged --quiet; then
            echo "Aucun nouveau contenu"
          else
            git commit -m "contenu: $(date -u +%Y-%m-%d-%H%M)"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Signaler un échec de génération
        if: steps.revue.outcome == 'failure' || steps.actualite.outcome == 'failure'
        run: |
          echo "::error::Revue: ${{ steps.revue.outcome }} / Actualité: ${{ steps.actualite.outcome }}"
          exit 1
